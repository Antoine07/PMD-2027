<rect x="45" y="935" width="1510" height="130" rx="12" fill="#f2edf9" stroke="#e1d5ee"/><text x="70" y="971" fill="#8b699f" font-size="18" font-weight="650">L’apprentissage doit être démontré individuellement.</text><text x="70" y="1001" class="copy">18 critères : théorie, pratique et argumentation sur six socles. Diagnostic initial, défense en M2, soutenance blanche en M5.</text><text x="70" y="1032" class="copy">Aucun score acquis inventé. Les graphiques observés de l’application utilisent les preuves renseignées. Relation client : Brontis et Antoine.</text>
<text x="45" y="1097" font-size="12" class="muted">99 jours de cours · 26 mercredis FOAD soutien · 104 activités plateforme · Mously : 30 % (25 % cours + 5 % coaching) · Cyber : 5 % · Durées à préciser</text></svg>
