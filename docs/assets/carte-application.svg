<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc">
<title id="title">HETIC : un premier MVP en M3, puis trois mois pour tester et améliorer.</title>
<desc id="desc">Carte mentale du parcours sur six mois. M1 : Cadrer et concevoir, Comprendre un problème client, Parcours, maquettes et états, Premiers risques et données. Livrable : Besoin et design justifiés; M2 : Comprendre et construire, Architecture, API, données et Python, Première application guidée, Bases IA/ML et sécurité du design. Livrable : Application simple expliquée; M3 : Premier MVP utilisable, Un parcours essentiel qui fonctionne, Vibe coding : relire, tester et corriger, Premiers essais avec des clients. Livrable : Premier MVP utilisable; M4 : Tester en conditions réelles, Intégrer, déployer et faire essayer, Observer les usages et les résultats, Protéger les accès et les secrets. Livrable : Pilote et retours documentés; M5 : Soutenance blanche, Tests utilisateurs et revue de sécurité, Pitch, démonstration et questions, Modifier le code et expliquer ses choix. Livrable : Retours et corrections priorisées; M6 : Demo Day clients, Version corrigée et MVP consolidé, Présentation aux clients et retours, Captation vidéo du parcours. Livrable : Démonstration finale filmée. La théorie du design et une application guidée précèdent le vibe coding. Cybersécurité : 5 % du volume total ; Mously : 30 % d’intervention. Les volumes et acquis restent à préciser et à observer.</desc>
