<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">HETIC : timeline des six mois et répartitions pédagogiques proposées.</title>
<desc id="desc">Parcours du 2027-01-01 au 2027-06-30. Bases IA, Data, applications, marketing, produit et cybersécurité, défense de proposition en M2, MVP ciblé en M3 après revue des bases, pilote, soutenance blanche et Demo Day. Pourcentages proposés : ils décrivent des activités et domaines, pas les acquis des apprenants.</desc>
<rect width="1600" height="1120" fill="#fbfafc"/><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.muted{fill:#927ca0}.copy{font-size:14px;fill:#8e779c}</style>
<text x="45" y="52" fill="#695077" font-size="30" font-weight="700">HETIC · du 1er janvier au 30 juin 2027</text>
<text x="45" y="88" font-size="17" class="muted">Acquérir les bases, construire et défendre une proposition utile à de vrais clients.</text>
<path d="M165 145H1440" stroke="#dbcee8" stroke-width="4" fill="none"/>
<circle cx="165" cy="145" r="13" fill="white" stroke="#9474bf" stroke-width="3"/><text x="165" y="122" text-anchor="middle" font-size="16" fill="#9474bf" font-weight="700">M1</text>
<rect x="45" y="180" width="235" height="260" rx="12" fill="white" stroke="#9474bf" stroke-opacity=".4"/>
<text x="61" y="210" font-size="17" font-weight="650" fill="#9474bf">Bases, besoin et design</text>
<text x="61" y="280" class="copy">Un diagnostic initial, un</text>
<text x="61" y="303" class="copy">segment et une proposition de</text>
<text x="61" y="326" class="copy">valeur appuyés par des</text>
<text x="61" y="349" class="copy">constats.</text>
<text x="61" y="416" font-size="12" class="muted">1 janv. → 31 janv.</text>
<circle cx="420" cy="145" r="13" fill="white" stroke="#9474bf" stroke-width="3"/><text x="420" y="122" text-anchor="middle" font-size="16" fill="#9474bf" font-weight="700">M2</text>
<rect x="300" y="180" width="235" height="260" rx="12" fill="white" stroke="#9474bf" stroke-opacity=".4"/>
<text x="316" y="210" font-size="17" font-weight="650" fill="#9474bf">Bases et proposition</text>
<text x="316" y="235" font-size="17" font-weight="650" fill="#9474bf">défendue</text>
<text x="316" y="280" class="copy">Une application guidée et une</text>
<text x="316" y="303" class="copy">défense produit/marketing,</text>
<text x="316" y="326" class="copy">avec un bilan individuel des</text>
<text x="316" y="349" class="copy">bases.</text>
<text x="316" y="416" font-size="12" class="muted">1 févr. → 28 févr.</text>
<circle cx="675" cy="145" r="13" fill="white" stroke="#4e927a" stroke-width="3"/><text x="675" y="122" text-anchor="middle" font-size="16" fill="#4e927a" font-weight="700">M3</text>
<rect x="555" y="180" width="235" height="260" rx="12" fill="white" stroke="#4e927a" stroke-opacity=".4"/>
<text x="571" y="210" font-size="17" font-weight="650" fill="#4e927a">Premier MVP ciblé</text>
<text x="571" y="280" class="copy">Un MVP visé après revue des</text>
<text x="571" y="303" class="copy">bases ; renforcer les acquis</text>
<text x="571" y="326" class="copy">ou réduire le périmètre si</text>
<text x="571" y="349" class="copy">nécessaire.</text>
<text x="571" y="416" font-size="12" class="muted">1 mars → 31 mars</text>
<circle cx="930" cy="145" r="13" fill="white" stroke="#9474bf" stroke-width="3"/><text x="930" y="122" text-anchor="middle" font-size="16" fill="#9474bf" font-weight="700">M4</text>
<rect x="810" y="180" width="235" height="260" rx="12" fill="white" stroke="#9474bf" stroke-opacity=".4"/>
<text x="826" y="210" font-size="17" font-weight="650" fill="#9474bf">Pilote et essais clients</text>
<text x="826" y="280" class="copy">Un pilote accessible et des</text>
<text x="826" y="303" class="copy">observations clients datées.</text>
<text x="826" y="416" font-size="12" class="muted">1 avr. → 30 avr.</text>
<circle cx="1185" cy="145" r="13" fill="white" stroke="#9474bf" stroke-width="3"/><text x="1185" y="122" text-anchor="middle" font-size="16" fill="#9474bf" font-weight="700">M5</text>
<rect x="1065" y="180" width="235" height="260" rx="12" fill="white" stroke="#9474bf" stroke-opacity=".4"/>
<text x="1081" y="210" font-size="17" font-weight="650" fill="#9474bf">Soutenance blanche</text>
<text x="1081" y="280" class="copy">Une soutenance qui justifie</text>
<text x="1081" y="303" class="copy">marché, produit, IA/Data,</text>
<text x="1081" y="326" class="copy">application et sécurité, avec</text>
<text x="1081" y="349" class="copy">corrections priorisées.</text>
<text x="1081" y="416" font-size="12" class="muted">1 mai → 31 mai</text>
<circle cx="1440" cy="145" r="13" fill="white" stroke="#9474bf" stroke-width="3"/><text x="1440" y="122" text-anchor="middle" font-size="16" fill="#9474bf" font-weight="700">M6</text>
<rect x="1320" y="180" width="235" height="260" rx="12" fill="white" stroke="#9474bf" stroke-opacity=".4"/>
<text x="1336" y="210" font-size="17" font-weight="650" fill="#9474bf">Demo Day clients</text>
<text x="1336" y="280" class="copy">Un MVP consolidé, des retours</text>
<text x="1336" y="303" class="copy">clients et une captation.</text>
<text x="1336" y="416" font-size="12" class="muted">1 juin → 30 juin</text>
