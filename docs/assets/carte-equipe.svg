<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Une équipe, des responsabilités complémentaires.</title>
<desc id="desc">Mously : 30 % au total (25 % cours + 5 % coaching). Michel intervient sur M1 à M3. Michel · M1 à M3: Fondements IA/Data et design, Analyse critique des propositions, Applications et design; Antoine · M1 à M6: Bases Python, statistiques et Data, Applications et code assisté, Rendez-vous clients avec Brontis; Yaaqoub · M3 à M5: API et architecture applicative, Intégration technique, Connexion des briques du MVP; Sion · M4 à M5: DevOps minimal, Déploiement du MVP, Conditions d’usage du pilote; Dany · M1–M3, M5, M6: Gestion de projet, Marché, message et argumentation, Défense M2 · soutenance M5; Production · M6: Captation de la démonstration, Storytelling du parcours, Film étudiants, HETIC, partenaires; Cybersécurité : 5 % du volume total, intervenant et affectation des heures à préciser, risques, conception, code, déploiement et revue du MVP.; Relation client : Brontis et Antoine, de M1 à M6.</desc>
