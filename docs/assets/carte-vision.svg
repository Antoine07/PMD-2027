<title id="title">HETIC : concevoir une application et un MVP IA/ML utiles aux clients.</title>
<desc id="desc">Marketing et produit: Segment et alternatives accessibles, Valeur, positionnement et périmètre, Constats clients et décisions défendues; Données et IA/ML: Python, maths et données autorisées, Une référence simple et des métriques, Des résultats et limites expliqués; Concevoir l’application: M1 : parcours, maquettes et états, M2 : architecture, API et données, Application guidée avant le vibe coding; Construire et défendre: M3 : MVP ciblé après revue des bases, Relire, tester et corriger le code, Modifier le code et défendre les choix; Cybersécurité · 5 %: Risques et sécurité dans le design, Entrées, accès, secrets et déploiement, Revue du MVP et limites documentées; Démontrer la valeur: M5 : soutenance blanche et corrections, M6 : MVP, pitch et retours clients, Un film pour valoriser le parcours</desc>
