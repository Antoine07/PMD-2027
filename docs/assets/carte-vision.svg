<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Un projet, deux progrès à rendre visibles.</title>
<desc id="desc">Des compétences IA/ML et une valeur client à démontrer, du cadrage au Demo Day.. Comprendre le besoin: Un segment client accessible, Un problème et une pratique actuelle, Entretiens et retours documentés; Expérimenter avec les données: Python, maths et données autorisées, Une référence simple et des métriques, Des erreurs et des limites expliquées; Construire le MVP: Interfaces, architecture et API, Un parcours complet et utilisable, Intégration et DevOps minimal; Prouver l’apprentissage: Reproduire une expérience, Modifier et expliquer son code, Distinguer assistance et maîtrise; Avancer sur six mois: M1 cadrer · M2 poser les bases, M3 construire · M4 intégrer, M5 tests et soutenance blanche; Rencontrer les clients: Essais clients pendant le parcours, M6 Demo Day : MVP et retours, Un film pour valoriser le travail</desc>
